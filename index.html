<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-mesh">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar: Danh sách bài chạy -->
        <aside class="sidebar glass-panel slide-in-left">
            <div class="sidebar-header">
                <h1>Run<span class="highlight">Analytics</span></h1>
                <p class="subtitle">Nhật ký tập luyện</p>
            </div>
            <div class="run-list-container">
                <ul id="run-list" class="run-list">
                    <!-- Javascript sẽ tự động điền danh sách vào đây -->
                    <div class="loading">Đang tải dữ liệu...</div>
                </ul>
            </div>
        </aside>

        <!-- Main Content: Chi tiết bài chạy -->
        <main class="main-content glass-panel slide-in-right" id="main-view">
            <div id="empty-state" class="empty-state">
                <i class="fa-solid fa-person-running"></i>
                <p>Chọn một bài tập bên trái để xem chi tiết</p>
            </div>

            <div id="run-details" class="run-details hidden fade-in">
                <header class="detail-header">
                    <div>
                        <h2 id="detail-name">Tên Bài Chạy</h2>
                        <span id="detail-date" class="badge">Ngày giờ</span>
                    </div>
                </header>
                
                <div class="metrics-grid">
                    <div class="metric-item glass-card">
                        <div class="metric-icon"><i class="fa-solid fa-route"></i></div>
                        <div class="metric-info">
                            <span class="metric-label">Quãng đường</span>
                            <span class="metric-value"><span id="detail-dist">0</span> <small>km</small></span>
                        </div>
                    </div>
                    <div class="metric-item glass-card">
                        <div class="metric-icon"><i class="fa-solid fa-stopwatch"></i></div>
                        <div class="metric-info">
                            <span class="metric-label">Pace</span>
                            <span class="metric-value"><span id="detail-pace">0:00</span> <small>/km</small></span>
                        </div>
                    </div>
                    <div class="metric-item glass-card">
                        <div class="metric-icon"><i class="fa-solid fa-heart-pulse"></i></div>
                        <div class="metric-info">
                            <span class="metric-label">Nhịp tim TB</span>
                            <span class="metric-value"><span id="detail-hr">0</span> <small>bpm</small></span>
                        </div>
                    </div>
                    <div class="metric-item glass-card">
                        <div class="metric-icon"><i class="fa-solid fa-shoe-prints"></i></div>
                        <div class="metric-info">
                            <span class="metric-label">Cadence</span>
                            <span class="metric-value"><span id="detail-cadence">0</span> <small>spm</small></span>
                        </div>
                    </div>
                </div>

                <div class="ai-analysis glass-card">
                    <div class="ai-header">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <h3>AI Phân tích</h3>
                    </div>
                    <div id="aiAnalysis" class="ai-box">
                        <!-- AI analysis goes here -->
                    </div>
                </div>
            
                <h3 class="section-title">Chỉ số chuyên sâu</h3>
                <div id="advancedStatsGrid" class="advanced-stats-grid">
                    <!-- Advanced stats rendered here -->
                </div>

                <h3 class="section-title">Phân bổ Nhịp tim (Time in Zones)</h3>
                <div class="zone-chart-container">
                    <div id="zoneChart" class="zone-chart">
                        <!-- Zone bars rendered here -->
                    </div>
                    <div id="zoneLegend" class="zone-legend">
                        <!-- Legend rendered here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
